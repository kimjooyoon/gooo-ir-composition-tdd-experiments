name: Frozen TDD study validation

on:
  pull_request:
    paths:
      - "scripts/prepare_study.py"
      - "scripts/run_study.py"
      - "scripts/run_study_v8.py"
      - "scripts/derive_study_v8.py"
      - "scripts/validate_frozen_study.py"
      - "study-design-v*/**"
      - "study-design-archives/**"
      - "preexecution-checkpoint/**"
      - "preexecution-checkpoint-v8/**"
      - "results/ir-composition-tdd-v7-20260930T101537Z-f1832bd67ec9/**"
      - ".github/workflows/frozen-study-validation.yml"
  push:
    paths:
      - "scripts/prepare_study.py"
      - "scripts/run_study.py"
      - "scripts/run_study_v8.py"
      - "scripts/derive_study_v8.py"
      - "scripts/validate_frozen_study.py"
      - "study-design-v*/**"
      - "study-design-archives/**"
      - "preexecution-checkpoint/**"
      - "preexecution-checkpoint-v8/**"
      - "results/ir-composition-tdd-v7-20260930T101537Z-f1832bd67ec9/**"
      - ".github/workflows/frozen-study-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frozen-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate the immutable v7 freeze
        run: >-
          python3 scripts/validate_frozen_study.py
          --design-dir study-design-v7
          --checkpoint-dir preexecution-checkpoint
          --output "$RUNNER_TEMP/frozen-study-v7.json"
      - name: Audit the preserved v7 partial provider capture
        run: >-
          python3 scripts/validate_frozen_study.py
          --design-dir study-design-v7
          --checkpoint-dir preexecution-checkpoint
          --run-dir results/ir-composition-tdd-v7-20260930T101537Z-f1832bd67ec9
          --output "$RUNNER_TEMP/frozen-study-v7-partial-capture.json"
      - name: Validate the derived v8 freeze and source checkpoint
        run: >-
          python3 scripts/validate_frozen_study.py
          --design-dir study-design-v8
          --checkpoint-dir preexecution-checkpoint-v8
          --output "$RUNNER_TEMP/frozen-study-v8.json"
