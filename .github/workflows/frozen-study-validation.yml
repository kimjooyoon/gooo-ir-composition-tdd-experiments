name: Frozen TDD study validation

on:
  pull_request:
    paths:
      - "scripts/prepare_study.py"
      - "scripts/run_study.py"
      - "scripts/validate_frozen_study.py"
      - "study-design-v*/**"
      - "study-design-archives/**"
      - "preexecution-checkpoint/**"
      - ".github/workflows/frozen-study-validation.yml"
  push:
    paths:
      - "scripts/prepare_study.py"
      - "scripts/run_study.py"
      - "scripts/validate_frozen_study.py"
      - "study-design-v*/**"
      - "study-design-archives/**"
      - "preexecution-checkpoint/**"
      - ".github/workflows/frozen-study-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frozen-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen plans and model-free captures
        run: python3 scripts/validate_frozen_study.py --output "$RUNNER_TEMP/frozen-study-validation.json"
